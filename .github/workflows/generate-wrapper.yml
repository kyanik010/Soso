# Triggered manually or via push to this file / app/build.gradle.kts
# Last manual trigger: see git history
name: Generate Gradle Wrapper

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-wrapper.yml'
      - 'app/build.gradle.kts'

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Verify files exist
        run: |
          ls -la gradlew
          ls -la gradlew.bat
          ls -la gradle/wrapper/gradle-wrapper.jar

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew gradlew.bat gradle/wrapper/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: generate Gradle wrapper 8.11.1"
            git push
          fi
