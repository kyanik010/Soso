name: Screenshot Verification v13

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshot-verify.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Launch Emulator and Capture Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "=== Waiting for emulator ==="
            adb wait-for-device

            echo "=== Installing APK ==="
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "=== Launching app once to initialize Room ==="
            adb shell monkey -p com.lumora.iptv -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell am force-stop com.lumora.iptv

            echo "=== Seeding a valid local session + sample content ==="
            adb shell "run-as com.lumora.iptv sqlite3 /data/data/com.lumora.iptv/databases/lumora_iptv_db 'INSERT OR REPLACE INTO accounts(id,host,username,serverName,expiryDate,status,lastSyncTimestamp) VALUES("primary_account","http://test.local","demo","Test Server","2099-12-31","Active",9999999999999); INSERT OR REPLACE INTO channels(streamId,num,name,streamIcon,categoryId,streamUrl,epgChannelId,isFavorite) VALUES(101,1,"Test Channel",NULL,"1","http://test.local/live/demo/pass/101.ts",NULL,0); INSERT OR REPLACE INTO movies(streamId,name,streamIcon,rating,categoryId,streamUrl,containerExtension,plot,duration,isFavorite) VALUES(201,"Test Movie",NULL,"0","2","http://test.local/movie/demo/pass/201.mp4","mp4",NULL,NULL,0); INSERT OR REPLACE INTO series(seriesId,name,cover,plot,cast,director,genre,releaseDate,rating,categoryId,isFavorite) VALUES(301,"Test Series",NULL,NULL,NULL,NULL,"Drama",NULL,"0","3",0);'"

            echo "=== Launching app with seeded session ==="
            adb shell monkey -p com.lumora.iptv -c android.intent.category.LAUNCHER 1
            sleep 8

            echo "=== Capturing startup Goldy screen ==="
            adb exec-out screencap -p > portrait.png

            echo "=== Tapping LIVE ==="
            adb shell input tap 350 430
            sleep 2
            adb exec-out screencap -p > live.png

            echo "=== Returning to Goldy ==="
            adb shell input keyevent KEYCODE_BACK
            sleep 1

            echo "=== Tapping MOVIES ==="
            adb shell input tap 350 560
            sleep 2
            adb exec-out screencap -p > movies.png

            echo "=== Returning to Goldy ==="
            adb shell input keyevent KEYCODE_BACK
            sleep 1

            echo "=== Tapping SERIES ==="
            adb shell input tap 350 690
            sleep 2
            adb exec-out screencap -p > series.png

            echo "=== Capturing logcat ==="
            adb logcat -d > logcat.txt

            echo "=== Switching to Landscape (orientation is app-locked) ==="
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 2
            adb exec-out screencap -p > landscape.png

            echo "=== Done ==="
            ls -la *.png *.txt

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            portrait.png
            landscape.png
            logcat.txt
          retention-days: 14
