<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eagle X</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;border:0;outline:0;background:none}
.app{width:100%;height:100%;padding:3vh 4vw;display:flex;flex-direction:column;gap:2vh;background:radial-gradient(circle at 20% 15%,#12304b 0,#07111f 45%,#040a12 100%)}
.header{height:16vh;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{height:100%;display:flex;align-items:center;gap:16px}
.logo{width:86px;height:86px;object-fit:contain}
.brand h1{font-size:clamp(24px,4vh,38px);font-weight:700;color:#fff}
.brand p{margin-top:5px;font-size:clamp(11px,1.8vh,16px);color:#8fa9bf}
.account{min-width:230px;padding:14px 20px;border:1px solid #21435f;border-radius:16px;background:#0b1b2c;text-align:right}
.account small{display:block;color:#7895ac;font-size:12px;margin-bottom:4px}
.account b{display:block;color:#e8f4ff;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{flex:1;display:flex;gap:2vw;min-height:0}
.menu{width:34%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{min-height:90px;border:1px solid #234661;border-radius:18px;background:#0c2033;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.card .ico{font-size:30px}
.card span{font-size:16px;font-weight:700}
.card:focus,.card.active{border-color:#27b7e8;background:#103653;box-shadow:0 0 0 2px #27b7e833}
.feature{flex:1;min-width:0;border:1px solid #1e3b53;border-radius:20px;background:#091a2a;padding:18px;display:flex;flex-direction:column;overflow:hidden}
.feature h2{font-size:20px;margin-bottom:12px}
.movies{display:flex;gap:14px;overflow:hidden;flex:1}
.movie{flex:1;min-width:130px;border:1px solid #21435d;border-radius:14px;overflow:hidden;background:#0d2235;display:flex;flex-direction:column}
.movie:focus{border-color:#27b7e8}
.movie img{width:100%;height:24vh;object-fit:cover;background:#132b40}
.movie b{padding:9px;font-size:13px;text-align:center;line-height:1.3}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#7895ac;font-size:15px}
.footer{height:7vh;min-height:38px;display:flex;align-items:center;justify-content:space-between;color:#6e879b;font-size:12px}
#toast{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:#122b40;border:1px solid #28516d;opacity:0;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<main class="app">
<header class="header">
  <div class="brand">
    <img class="logo" src="./40.png" alt="Eagle X">
    <div><h1>Eagle X</h1><p>مشغل IPTV</p></div>
  </div>
  <div class="account">
    <small>الحساب</small>
    <b id="username">غير مسجل</b>
    <small id="expiry">الانتهاء: غير محدد</small>
  </div>
</header>

<section class="content">
  <nav class="menu" aria-label="القائمة">
    <button class="card focusable active" data-nav="live"><span class="ico">📺</span><span>القنوات</span></button>
    <button class="card focusable" data-nav="movies"><span class="ico">🎬</span><span>الأفلام</span></button>
    <button class="card focusable" data-nav="series"><span class="ico">📚</span><span>المسلسلات</span></button>
    <button class="card focusable" data-nav="settings"><span class="ico">⚙</span><span>الإعدادات</span></button>
  </nav>
  <section class="feature">
    <h2>آخر الأفلام</h2>
    <div id="movies" class="movies"><div class="empty">جاري تحميل المحتوى...</div></div>
  </section>
</section>

<footer class="footer"><span>Eagle X</span><span>اختر قسمًا للبدء</span></footer>
<div id="toast"></div>
</main>

<script>
"use strict";
var MOVIES=[];
function el(id){return document.getElementById(id)}
function toast(t){var x=el("toast");x.textContent=String(t||"");x.className="on";setTimeout(function(){x.className=""},1200)}
function emit(name,payload){
  try{if(window.Android&&typeof window.Android[name]==="function")window.Android[name](JSON.stringify(payload||{}))}catch(e){}
}
window.IPTV={
 setMovies:function(list){MOVIES=Array.isArray(list)?list:[];renderMovies()},
 setAccount:function(a){
   a=a||{};
   el("username").textContent=a.username||"غير مسجل";
   el("expiry").textContent="الانتهاء: "+(a.expiryDate||"غير محدد");
 },
 refresh:function(){renderMovies()}
};
function renderMovies(){
 var box=el("movies");box.innerHTML="";
 if(!MOVIES.length){box.innerHTML='<div class="empty">لا توجد أفلام متاحة حاليًا</div>';return}
 MOVIES.slice(0,4).forEach(function(m){
   var b=document.createElement("button");b.className="movie focusable";b.type="button";
   if(m.img){var i=document.createElement("img");i.src=String(m.img);i.alt="";i.onerror=function(){this.style.display="none"};b.appendChild(i)}
   var t=document.createElement("b");t.textContent=m.title||"فيلم";b.appendChild(t);
   b.onclick=function(){emit("onOpen",m)};
   box.appendChild(b);
 });
}
document.querySelectorAll("[data-nav]").forEach(function(b){
 b.onclick=function(){
   document.querySelectorAll("[data-nav]").forEach(function(x){x.classList.remove("active")});
   b.classList.add("active");
   emit("onNavigate",b.getAttribute("data-nav"));
 };
});
document.addEventListener("keydown",function(e){
 var map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};
 if(!map[e.key])return;
 e.preventDefault();
 var items=Array.prototype.slice.call(document.querySelectorAll(".focusable"));
 var cur=document.activeElement,idx=items.indexOf(cur);
 if(idx<0)idx=0;
 var next;
 if(e.key==="ArrowRight"||e.key==="ArrowDown")next=(idx+1)%items.length;
 else next=(idx-1+items.length)%items.length;
 if(items[next])items[next].focus();
 if(e.key==="Enter"&&cur&&typeof cur.click==="function")cur.click();
});
renderMovies();
setTimeout(function(){var x=document.querySelector(".card.active");if(x)x.focus()},150);
</script>
</body>
</html>
