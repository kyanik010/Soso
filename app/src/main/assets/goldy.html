<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPTV Home</title>

<style>

:root{
  --u:min(calc(100vw / 739),calc(100vh / 415));
  --cyan:#00d4ff;
  --cyan-light:#7dd3fc;
  --bg:#020617;
}


*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:#fff;
  font-family:Roboto,Arial,sans-serif;
}

button{
  font:inherit;
  color:inherit;
  background:none;
  border:0;
  outline:0;
  cursor:pointer;
}


/* =========================================================
   BACKGROUND
   ========================================================= */

.bg{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #020617 0%,
      #061428 50%,
      #0a1e3d 100%
    );
}

.bg::before{
  content:"";
  position:absolute;
  top:-30%;
  right:-40%;
  width:140%;
  height:160%;

  background:
    radial-gradient(
      ellipse 60% 40% at 50% 50%,
      rgba(0,212,255,.15) 0%,
      rgba(0,150,220,.08) 30%,
      transparent 70%
    );

  border-radius:50%;
  transform:rotate(-15deg);
  filter:blur(40px);
  pointer-events:none;
}

.bg::after{
  content:"";
  position:absolute;
  top:-50%;
  right:-20%;
  width:100%;
  height:180%;

  background:
    linear-gradient(
      160deg,
      transparent 40%,
      rgba(0,212,255,.12) 48%,
      rgba(125,211,252,.15) 50%,
      rgba(0,212,255,.12) 52%,
      transparent 60%
    );

  transform:rotate(-20deg);
  filter:blur(25px);
  pointer-events:none;
}

.light-beam{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse 80% 50% at 100% 0%,
      rgba(0,212,255,.25) 0%,
      rgba(0,180,216,.15) 25%,
      rgba(0,119,182,.08) 45%,
      transparent 65%
    ),
    conic-gradient(
      from 200deg at 95% 10%,
      transparent 0deg,
      rgba(0,212,255,.10) 20deg,
      rgba(125,211,252,.20) 40deg,
      rgba(0,212,255,.12) 60deg,
      transparent 90deg
    );

  filter:blur(15px);
  pointer-events:none;
  mix-blend-mode:screen;
}

.bg svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.15;
}


/* =========================================================
   STAGE
   ========================================================= */

.stage{
  position:relative;
  z-index:1;

  width:calc(739 * var(--u));
  height:calc(415 * var(--u));

  margin:0 auto;

  top:50%;
  transform:translateY(-50%);
}

.stage > *{
  position:absolute;
}


/* =========================================================
   DOTS
   ========================================================= */

.dots{
  display:grid;
  gap:calc(5 * var(--u));
  padding:calc(6 * var(--u));
  margin:calc(-6 * var(--u));
  border-radius:calc(6 * var(--u));
}

.dots i{
  display:block;
  width:calc(4 * var(--u));
  height:calc(4 * var(--u));
  border-radius:50%;
}

.tl{
  left:calc(54 * var(--u));
  top:calc(31 * var(--u));
  grid-template-columns:repeat(3,calc(4 * var(--u)));
}

.tl i{
  background:#4dd0e1;
}

.tl i:nth-child(3n){
  background:var(--cyan);
}

.br{
  left:calc(693.5 * var(--u));
  top:calc(379.5 * var(--u));
  grid-template-columns:repeat(4,calc(3 * var(--u)));
  gap:calc(2.8 * var(--u));
}

.br i{
  width:calc(3 * var(--u));
  height:calc(3 * var(--u));
  background:#4dd0e1;
}


/* =========================================================
   INFO
   ========================================================= */

.info{
  left:calc(582 * var(--u));
  top:calc(10 * var(--u));

  display:flex;
  align-items:flex-start;
  gap:calc(5 * var(--u));
}

.info svg{
  width:calc(21 * var(--u));
  height:calc(17 * var(--u));
  margin-top:calc(5 * var(--u));
}

.date{
  width:calc(46 * var(--u));
  text-align:center;
  line-height:1.25;
  font-size:calc(12.5 * var(--u));
}

.date span:first-child{
  display:block;
  font-size:calc(11.5 * var(--u));
}

#time{
  font-size:calc(16 * var(--u));
  line-height:calc(29 * var(--u));
  margin-left:calc(2 * var(--u));
  white-space:nowrap;
}


/* =========================================================
   FEATURE
   ========================================================= */

.feat{
  left:calc(83 * var(--u));
  top:calc(62 * var(--u));

  width:calc(126 * var(--u));

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:calc(8 * var(--u));
}

.cat{
  font:
    400 calc(19.5 * var(--u))/1.2
    Inter,Roboto,sans-serif;

  white-space:nowrap;
  color:var(--cyan-light);
}


/* =========================================================
   RAIL
   ========================================================= */

.rail{
  left:calc(233.5 * var(--u));
  top:calc(62 * var(--u));
}

h1{
  font:
    700 calc(27 * var(--u))
    /calc(28 * var(--u))
    Inter,Roboto,sans-serif;

  letter-spacing:-.2px;
  margin-bottom:calc(12 * var(--u));
  color:#e0f2fe;
}

.row{
  display:flex;
  justify-content:center;
  gap:calc(17 * var(--u));
}


/* =========================================================
   POSTERS
   ========================================================= */

.poster{
  position:relative;
  display:block;
  flex:none;
  overflow:hidden;

  width:calc(115 * var(--u));
  height:calc(190 * var(--u));

  background:linear-gradient(160deg,#1a2d4d,#0a1428);

  border:
    calc(1 * var(--u))
    solid
    rgba(0,212,255,.65);

  border-radius:calc(7 * var(--u));

  transition:
    transform .22s cubic-bezier(.2,.8,.3,1.2),
    box-shadow .22s,
    border-color .22s;

  transform-origin:center;
  z-index:1;
}

.poster img{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
}

.poster b{
  position:absolute;

  left:6%;
  right:6%;
  bottom:8%;

  font:
    600 calc(9 * var(--u))
    /1.2
    Poppins,Roboto,sans-serif;

  text-align:center;
  color:#e0f2fe;

  text-shadow:0 1px 4px #000;

  overflow:hidden;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.poster.sel,
.poster:focus-visible{
  border-color:var(--cyan);

  box-shadow:
    0 0 calc(22 * var(--u))
      rgba(0,212,255,.55),
    0 calc(7 * var(--u))
      calc(20 * var(--u))
      rgba(0,0,0,.7);

  transform:scale(1.08);
  z-index:10;
}

.poster:active{
  transform:scale(1.11);
}

.poster.loading::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent 30%,
      rgba(255,255,255,.08) 45%,
      rgba(255,255,255,.14) 50%,
      rgba(255,255,255,.08) 55%,
      transparent 70%
    );

  animation:shimmer 1.5s infinite;
}

@keyframes shimmer{
  from{
    transform:translateX(-100%);
  }

  to{
    transform:translateX(100%);
  }
}


/* =========================================================
   MAIN NAVIGATION
   ========================================================= */

.panel{
  left:calc(78 * var(--u));
  top:calc(320 * var(--u));

  width:calc(584 * var(--u));
  height:calc(80 * var(--u));

  display:flex;
  align-items:center;

  gap:calc(19.5 * var(--u));

  padding:
    calc(9 * var(--u))
    calc(15 * var(--u));

  background:
    linear-gradient(
      180deg,
      #0d1a30,
      #08111f
    );

  border:
    1px solid
    rgba(0,212,255,.15);

  border-radius:calc(6 * var(--u));
}

.btn{
  display:flex;
  align-items:center;
  justify-content:flex-start;

  gap:calc(14 * var(--u));

  flex:1;

  height:calc(52.5 * var(--u));

  padding-left:calc(12 * var(--u));

  border-radius:calc(6 * var(--u));

  background:
    linear-gradient(
      180deg,
      #1a2d4d,
      #122340
    );

  color:var(--cyan-light);

  border:
    1px solid
    rgba(0,212,255,.12);

  font:
    500 calc(15 * var(--u))
    Poppins,sans-serif;

  white-space:nowrap;

  transition:
    background .15s,
    box-shadow .15s,
    color .15s,
    transform .15s;
}

.btn svg{
  flex:none;

  width:calc(28 * var(--u));
  height:calc(29 * var(--u));
}

.btn.act{
  border:
    calc(2 * var(--u))
    solid
    var(--cyan);

  background:
    linear-gradient(
      180deg,
      #00b4d8,
      #0077b6
    );

  color:#fff;

  font-weight:600;

  box-shadow:
    0 0 calc(18 * var(--u))
      rgba(0,212,255,.4),
    inset 0 1px 0
      rgba(255,255,255,.2);
}

.btn:hover{
  background:
    linear-gradient(
      180deg,
      #234166,
      #1a2d4d
    );

  color:#a5f3fc;
}

.btn.act:hover{
  background:
    linear-gradient(
      180deg,
      #00d4ff,
      #0096c7
    );
}

.btn:focus-visible{
  box-shadow:
    0 0 0 calc(2 * var(--u))
      var(--cyan),
    0 0 calc(16 * var(--u))
      rgba(0,212,255,.4);
}

.btn:active{
  transform:scale(.97);
}


/* =========================================================
   TOAST
   ========================================================= */

#toast{
  left:50%;
  top:calc(298 * var(--u));

  transform:translateX(-50%);

  padding:
    calc(4 * var(--u))
    calc(12 * var(--u));

  border-radius:99px;

  background:rgba(0,20,40,.9);

  color:var(--cyan-light);

  font-size:calc(11 * var(--u));

  opacity:0;

  transition:opacity .2s;

  pointer-events:none;

  white-space:nowrap;

  border:
    1px solid
    rgba(0,212,255,.3);

  z-index:100;
}

#toast.on{
  opacity:1;
}

.empty{
  width:100%;
  text-align:center;

  color:
    rgba(125,211,252,.6);

  font-size:calc(13 * var(--u));

  padding:calc(25 * var(--u));
}


/* =========================================================
   ACCOUNT — BOTH HIDDEN BY DEFAULT
   ========================================================= */

.account-info-portrait,
.account-info-landscape{
  display:none;
}


/* =========================================================
   LANDSCAPE ONLY
   ========================================================= */



  html.goldy-landscape h1,
html.goldy-landscape .cat,
html.goldy-landscape .tl,
html.goldy-landscape .br,
html.goldy-landscape .feat,
html.goldy-landscape .info{
    display:none !important;
  }

  html.goldy-landscape .rail{
    top:calc(500 * var(--u));
    left:0;
    width:100%;
    max-width:calc(739 * var(--u));
    padding:0 calc(35 * var(--u));
  }

  html.goldy-landscape .row{
    gap:calc(20 * var(--u));
  }

  html.goldy-landscape .poster{
    width:calc(145 * var(--u));
    height:calc(235 * var(--u));
  }

  html.goldy-landscape .poster.sel,
html.goldy-landscape .poster:focus-visible{
    transform:scale(1.06);
  }

  html.goldy-landscape .panel{
    top:calc(325 * var(--u));
  }


  /* =======================================================
     LANDSCAPE LOGO
     ======================================================= */

  html.goldy-landscape .landscape-logo{

display:flex;

    position:absolute;

    left:calc(-120 * var(--u));
    top:50%;

    transform:translateY(-50%);

    width:calc(190 * var(--u));
height:calc(160 * var(--u));

    align-items:center;
    justify-content:center;

    z-index:20;

    pointer-events:none;
  }

  html.goldy-landscape .landscape-logo img{

    display:block;

    width:auto;
    height:auto;

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    user-select:none;
    -webkit-user-drag:none;
  }


  /* =======================================================
     LANDSCAPE ACCOUNT
     ======================================================= */

  html.goldy-landscape .account-info-landscape{

    display:flex;

    position:absolute;

    left:calc(700* var(--u));
    top:50%;

    transform:translateY(-50%);

    width:calc(125 * var(--u));

    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    z-index:20;
  }

  html.goldy-landscape .account-info-landscape
  .account-title{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:calc(6 * var(--u));

    margin-bottom:calc(10 * var(--u));

    color:#e0f2fe;

    font:
      500 calc(18 * var(--u))
      /1.2
      Roboto,Arial,sans-serif;

    white-space:nowrap;
  }

  html.goldy-landscape .account-info-landscape
  .account-user-icon{

    display:flex;

    align-items:center;
    justify-content:center;

    width:calc(29 * var(--u));
    height:calc(29 * var(--u));

    border-radius:50%;

    color:var(--cyan-light);

    background:
      rgba(0,212,255,.08);

    border:
      1px solid
      rgba(0,212,255,.18);
  }

  html.goldy-landscape .account-info-landscape
  .account-user-icon svg{

    width:calc(17 * var(--u));
    height:calc(17 * var(--u));

    fill:none;

    stroke:currentColor;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;
  }

  html.goldy-landscape .account-info-landscape
  .account-line{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:calc(3 * var(--u));

    margin-bottom:calc(8 * var(--u));
  }

  html.goldy-landscape .account-info-landscape
  .account-label{

    color:
      rgba(125,211,252,.62);

    font:
      400 calc(8 * var(--u))
      /1.2
      Roboto,Arial,sans-serif;

    white-space:nowrap;
  }

  html.goldy-landscape .account-info-landscape
  .account-value{

    color:#e0f2fe;

    font:
      500 calc(8.5 * var(--u))
      /1.2
      Roboto,Arial,sans-serif;

    white-space:nowrap;

    text-align:center;
  }

  html.goldy-landscape .account-info-landscape
  .account-expiry{
    color:var(--cyan-light);
  }




/* =========================================================
   VERY SHORT LANDSCAPE
   ========================================================= */



  html.goldy-landscape.goldy-short-landscape .rail{
    top:calc(80 * var(--u));
  }

  html.goldy-landscape.goldy-short-landscape .poster{
    width:calc(130 * var(--u));
    height:calc(210 * var(--u));
  }

  html.goldy-landscape.goldy-short-landscape .panel{
    top:calc(315 * var(--u));
  }


.landscape-logo{
  display:none !important;
}


  html.goldy-landscape .landscape-logo{
    display:flex !important;
  }


/* =======================================================
   PORTRAIT LOGO
   ======================================================= */



  html. .landscape-logo{
    display:flex !important;
    position:absolute;

    left:50%;
    top:calc(10 * var(--u));

    transform:translateX(-50%);

    width:calc(200 * var(--u));
    height:calc(135 * var(--u));

    align-items:center;
    justify-content:center;

    z-index:100;

    pointer-events:none;
  }

  html. .landscape-logo img{
    display:block;

    width:auto;
    height:auto;

    max-width:100%;
    max-height:100%;

    object-fit:contain;
  }



 
</style>
<!-- Verified restore baseline: 9bc1ddd portrait/landscape UI -->
</head>


<body>



<div class="bg" aria-hidden="true">

  <div class="light-beam"></div>

  <svg
    viewBox="0 0 739 415"
    preserveAspectRatio="xMaxYMin slice"
    aria-hidden="true">

    <defs>

      <filter
        id="bl"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%">

        <feGaussianBlur stdDeviation="9"/>

      </filter>

      <filter id="bs">

        <feGaussianBlur stdDeviation="1.2"/>

      </filter>

      <radialGradient id="pk">

        <stop
          offset="0"
          stop-color="#00d4ff"/>

        <stop
          offset="1"
          stop-color="#00d4ff"
          stop-opacity="0"/>

      </radialGradient>

      <radialGradient id="bu">

        <stop
          offset="0"
          stop-color="#0077b6"/>

        <stop
          offset="1"
          stop-color="#0077b6"
          stop-opacity="0"/>

      </radialGradient>

      <linearGradient
        id="mt"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

        <stop
          offset="0"
          stop-color="#4dd0e1"/>

        <stop
          offset=".45"
          stop-color="#1e40af"/>

        <stop
          offset="1"
          stop-color="#0a1428"/>

      </linearGradient>

      <linearGradient
        id="fl"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

        <stop
          offset="0"
          stop-color="#0a1a35"
          stop-opacity="0"/>

        <stop
          offset="1"
          stop-color="#06101f"/>

      </linearGradient>

    </defs>


    <circle
      cx="560"
      cy="40"
      r="170"
      fill="url(#bu)"
      opacity=".5"/>


    <circle
      cx="520"
      cy="90"
      r="150"
      fill="url(#pk)"
      opacity=".5"/>


    <g
      filter="url(#bl)"
      opacity=".5">

      <path
        d="M440 120 L560 60 L650 12 L700 0 L600 60 L520 130Z"
        fill="#0096c7"/>

      <path
        d="M600 90 L739 20 L739 90 L650 130Z"
        fill="#0077b6"/>

    </g>


    <g filter="url(#bs)">

      <path
        d="M520 150 L545 126 L575 148 L610 200 L520 200Z"
        fill="#1e3a8a"/>

      <path
        d="M610 200 L645 120 L672 70 L700 100 L739 80 L739 215 L610 215Z"
        fill="url(#mt)"/>

    </g>


    <ellipse
      cx="400"
      cy="235"
      rx="420"
      ry="70"
      fill="#0c4a6e"
      opacity=".4"
      filter="url(#bl)"/>


    <rect
      y="230"
      width="739"
      height="185"
      fill="url(#fl)"/>


    <circle
      cx="400"
      cy="57"
      r="8"
      fill="none"
      stroke="#7dd3fc"
      stroke-opacity=".4"/>

  </svg>

</div>



<main class="stage">


  <!-- =====================================================
       PORTRAIT ACCOUNT

          </circle>

  </section>



  <!-- =====================================================
       TOP MENU

  <button
    class="dots tl focusable"
    data-act="menu"

    <i></i><i></i><i></i>
    <i></i><i></i><i></i>
    <i></i><i></i><i></i>

  </button>



  <!-- =====================================================
       DATE / TIME
       ===================================================== -->

  <div class="info">

    <svg
      viewBox="0 0 21 17"
      fill="none"
      stroke="#7dd3fc"
      stroke-width="2.2"

<script>

"use strict";


/* =========================================================
   IPTV DATA
   ========================================================= */

let MOVIES = [];


/* =========================================================
   DOM
   ========================================================= */

const $ =
  selector =>
    document.querySelector(selector);


/* =========================================================
   BRIDGE
   ========================================================= */

window.IPTV = {

  onNavigate(key){},

  onOpen(movie){},

  onMenu(){},

  onApps(){},

  setMovies(list){

    MOVIES =
      Array.isArray(list)
        ? list
        : [];

    render();

  },

  setAccount(account){

    const values =
      document.querySelectorAll(".account-value");

    const username =
      account && account.username
        ? String(account.username)
        : "غير مسجل";

    const expiry =
      account && account.expiryDate
        ? String(account.expiryDate)
        : "غير محدد";

    values.forEach((el,index) => {
      setText(el,index % 2 === 0 ? username : expiry);
    });

  }

};


function emit(name,payload){

  try{

    if(
      window.IPTV &&
      typeof window.IPTV[name] === "function"
    ){

      window.IPTV[name](payload);

    }

  }catch(e){}


  try{

    if(
      window.Android &&
      typeof window.Android[name] === "function"
    ){

      window.Android[name](
        JSON.stringify(payload || {})
      );

    }

  }catch(e){}


  try{

    document.dispatchEvent(
      new CustomEvent(
        "iptv:" + name,
        {
          detail:payload
        }
      )
    );

  }catch(e){}

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;

function toast(message){

  const el =
    $("#toast");

  if(!el)
    return;

  el.textContent =
    String(message || "");

  el.classList.add("on");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      () =>
        el.classList.remove("on"),
      1400
    );

}


/* =========================================================
   TEXT
   ========================================================= */

function setText(element,text){

  element.textContent =
    text == null
      ? ""
      : String(text);

}


/* =========================================================
   PLACEHOLDER
   ========================================================= */

function createPlaceholderPoster(){

  const button =
    document.createElement("button");

  button.className =
    "poster focusable loading";

  button.type =
    "button";

  button.setAttribute(
    "aria-label",
    "Loading"
  );


  const label =
    document.createElement("b");

  setText(
    label,
    ""
  );


  button.appendChild(
    label
  );


  button.onclick =
    () => {

      toast(
        "Loading..."
      );

    };


  return button;

}


/* =========================================================
   POSTER
   ========================================================= */

function createPoster(movie){

  const button =
    document.createElement("button");

  button.className =
    "poster focusable";

  button.type =
    "button";


  const id =
    movie &&
    movie.id != null
      ? String(movie.id)
      : "";


  const title =
    movie &&
    movie.title != null
      ? String(movie.title)
      : "";


  button.dataset.id =
    id;


  button.setAttribute(
    "aria-label",
    title || "Movie"
  );


  if(
    movie &&
    movie.img
  ){

    const img =
      document.createElement("img");

    img.alt =
      "";

    img.loading =
      "lazy";

    img.decoding =
      "async";

    img.src =
      String(movie.img);


    img.onerror =
      () => {

        img.remove();

      };


    button.appendChild(
      img
    );

  }


  const label =
    document.createElement("b");

  setText(
    label,
    title
  );


  button.appendChild(
    label
  );


  button.onclick =
    () => {

      selectPoster(
        button
      );

      emit(
        "onOpen",
        movie
      );

    };


  return button;

}


/* =========================================================
   SELECTION
   ========================================================= */

function selectPoster(button){

  document
    .querySelectorAll(
      ".poster"
    )
    .forEach(
      poster => {

        poster.classList.toggle(
          "sel",
          poster === button
        );

      }
    );

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){
  const row1=$("#row1"), row2=$("#row2");
  if(!row1||!row2)return;
  row1.replaceChildren(); row2.replaceChildren();
  if(MOVIES.length===0){for(let i=0;i<4;i++)row1.appendChild(createPlaceholderPoster());return;}
  MOVIES.slice(0,4).forEach(movie=>row1.appendChild(createPoster(movie)));
}

/* =========================================================
   LANDSCAPE ONLY
   ========================================================= */
function applyLandscapeMode(){
  document.documentElement.classList.add("goldy-landscape");
  document.documentElement.classList.remove("","");
  document.documentElement.classList.toggle("goldy-short-landscape",window.innerHeight<=360);
}
applyLandscapeMode();
window.addEventListener("resize",function(){applyLandscapeMode();render();},{passive:true});

/* =========================================================
   NAVIGATION
   ========================================================= */

document
  .querySelectorAll(
    "[data-nav]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          document
            .querySelectorAll(
              "[data-nav]"
            )
            .forEach(
              item => {

                item.classList.toggle(
                  "act",
                  item === button
                );

              }
            );


          const key =
            button.dataset.nav;


          emit(
            "onNavigate",
            key
          );

        };

    }
  );


/* =========================================================
   MENU
   ========================================================= */

document
  .querySelectorAll(
    '[data-act="menu"]'
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          emit(
            "onMenu"
          );

        };

    }
  );


/* =========================================================
   APPS
   ========================================================= */

document
  .querySelectorAll(
    '[data-act="apps"]'
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          emit(
            "onApps"
          );

        };

    }
  );


/* =========================================================
   CLOCK
   ========================================================= */

function tick(){

  const time =
    $("#time");

  const dow =
    $("#dow");

  const dm =
    $("#dm");


  if(
    !time ||
    !dow ||
    !dm
  )
    return;


  const date =
    new Date();


  setText(
    time,
    date
      .toLocaleTimeString(
        "en-US",
        {
          hour:"numeric",
          minute:"2-digit"
        }
      )
      .toLowerCase()
  );


  setText(
    dow,
    date.toLocaleDateString(
      "en-US",
      {
        weekday:"short"
      }
    )
  );


  setText(
    dm,
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )
    +
    " "
    +
    date.toLocaleDateString(
      "en-US",
      {
        month:"short"
      }
    )
  );

}


tick();

setInterval(
  tick,
  15000
);


/* =========================================================
   D-PAD
   ========================================================= */

function centerOf(element){

  const rect =
    element.getBoundingClientRect();


  return {

    x:
      rect.left +
      rect.width / 2,

    y:
      rect.top +
      rect.height / 2

  };

}


function getFocusable(){

  return [
    ...document.querySelectorAll(
      ".focusable"
    )
  ].filter(
    element =>
      element.offsetParent !== null
  );

}


function findDirectionalTarget(
  current,
  direction
){

  const currentCenter =
    centerOf(
      current
    );


  let best =
    null;

  let bestScore =
    Infinity;


  getFocusable()
    .forEach(
      candidate => {

        if(
          candidate === current
        )
          return;


        const point =
          centerOf(
            candidate
          );


        const dx =
          point.x -
          currentCenter.x;


        const dy =
          point.y -
          currentCenter.y;


        let primary;

        let secondary;


        if(
          direction === "left"
        ){

          primary =
            -dx;

          secondary =
            Math.abs(dy);

        }

        else if(
          direction === "right"
        ){

          primary =
            dx;

          secondary =
            Math.abs(dy);

        }

        else if(
          direction === "up"
        ){

          primary =
            -dy;

          secondary =
            Math.abs(dx);

        }

        else{

          primary =
            dy;

          secondary =
            Math.abs(dx);

        }


        if(
          primary <= 0
        )
          return;


        const score =
          primary +
          secondary * 1.8;


        if(
          score < bestScore
        ){

          bestScore =
            score;

          best =
            candidate;

        }

      }
    );


  return best;

}


window.addEventListener(
  "keydown",
  event => {

    const directions = {

      ArrowLeft:"left",
      ArrowRight:"right",
      ArrowUp:"up",
      ArrowDown:"down"

    };


    const direction =
      directions[
        event.key
      ];


    if(!direction)
      return;


    event.preventDefault();


    const focusable =
      getFocusable();


    let current =
      focusable.includes(
        document.activeElement
      )
        ? document.activeElement
        : null;


    if(!current){

      current =
        document.querySelector(
          ".btn.act"
        ) ||
        focusable[0];

    }


    if(!current)
      return;


    const target =
      findDirectionalTarget(
        current,
        direction
      );


    if(target){

      target.focus({
        preventScroll:true
      });


      if(
        target.classList.contains(
          "poster"
        )
      ){

        selectPoster(
          target
        );

      }

    }

  },
  {
    passive:false
  }
);


/* =========================================================
   INITIAL
   ========================================================= */

applyOrientation();
render();


/* =========================================================
   PUBLIC API
   ========================================================= */

window.IPTV.refresh =
  function(){

    render();

  };


window.IPTV.setActiveNavigation =
  function(key){

    document
      .querySelectorAll(
        "[data-nav]"
      )
      .forEach(
        button => {

          button.classList.toggle(
            "act",
            button.dataset.nav === key
          );

        }
      );

  };


/* =========================================================
   DEFAULT FOCUS
   ========================================================= */

setTimeout(
  () => {

    const active =
      document.querySelector(
        ".btn.act"
      );


    if(active){

      try{

        active.focus({
          preventScroll:true
        });

      }catch(e){}

    }

  },
  100
);

</script>
